services:
  pipeline:
    build: .
    image: ai-architect-pipeline:latest
    container_name: ai-architect-pipeline
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - ${TARGET_REPO:?Set TARGET_REPO}:/workspace/target:ro
      - ./config:/app/config
      - ./runs:/app/runs
      - ./logs:/app/logs
      - ${HOME}/.claude:/home/pipeline/.claude-host:ro
      - ${HOME}/.aiprd:/home/pipeline/.aiprd:ro
